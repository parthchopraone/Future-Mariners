[build]
  command = "npx prisma generate && npm run build"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/_next/image"
  to = "/.netlify/images?url=:url&w=:width&q=:quality"
  status = 200
  force = true

  [redirects.query]
    url = ":url"
    w = ":width"
    q = ":quality"

[[redirects]]
  from = "/_ipx/*"
  to = "/.netlify/images?url=:url&w=:width&q=:quality"
  status = 200
  force = true

  [redirects.query]
    url = ":url"
    w = ":width"
    q = ":quality"
